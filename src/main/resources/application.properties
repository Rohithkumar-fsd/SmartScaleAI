spring.application.name=smartscale-ai
server.port=${PORT:8080}

# Redis Connection (defaults to localhost:6379 if not provided by Docker)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=10000ms
spring.data.redis.timeout=10000ms

# Stream settings
smartscale.stream.key=inference:jobs
smartscale.stream.group=inference-workers
smartscale.stream.dlq=inference:jobs:dlq
smartscale.stream.min-idle-time-ms=30000
smartscale.worker.max-attempts=3

# Worker Toggle (defaults to true if not specified)
smartscale.worker.enabled=${WORKER_ENABLED:true}

# Health Check Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always